name: R-CMD-check

# Calls the shared workflow in chross22/distsamp so the check configuration
# lives in one place across these packages.
#
# Two inputs beyond the defaults, both because of dependencies that are not
# on CRAN:
#   - fancyfx is imported and lives on GitHub, so it is installed explicitly;
#   - rnaturalearthhires is suggested and lives on r-universe, and without the
#     extra repository pak fails to resolve the Suggests field at all.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  check:
    uses: chross22/distsamp/.github/workflows/r-cmd-check-reusable.yaml@main
    with:
      apt-packages: 'libgdal-dev libgeos-dev libproj-dev libudunits2-dev'
      extra-packages: 'any::rcmdcheck, github::chross22/fancyfx'
      extra-repositories: 'https://ropensci.r-universe.dev'
